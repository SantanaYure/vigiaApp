name: Coleta INMET

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  coletar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r agents/requirements.txt

      - name: Rodar agente de Coleta
        run: python -m agents.coleta.run --out public/data/avisos-inmet.json

      - name: Commitar avisos atualizados, se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/avisos-inmet.json
          git diff --cached --quiet || git commit -m "chore: atualizar avisos do INMET [skip ci]"
          git push
